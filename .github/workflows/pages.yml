name: Replay viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: web
      - name: Build base-path-safe viewer
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /Voyager/
          VITE_STATIC_REPLAYS: "1"
      - name: Export curated replay data
        run: |
          python scripts/export_static_viewer.py \
            --output web/dist/static-api \
            --spa-index web/dist/index.html
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy replay viewer
        id: deployment
        uses: actions/deploy-pages@v4
