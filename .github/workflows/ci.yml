name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check voyager tests examples
      - name: Type check
        run: mypy voyager
      - name: Test
        run: pytest -q

  wheel:
    name: Clean wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/voyager-wheel-smoke
          /tmp/voyager-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/voyager-wheel-smoke/bin/python - <<'PY'
          from pettingzoo.test import parallel_api_test

          import voyager
          from voyager.benchmark.island import load_island_seed_manifests
          from voyager.envs import VoyagerIslandEnv

          assert voyager.__version__ == "0.1.0"
          assert set(load_island_seed_manifests()) == {"train", "development", "test"}
          parallel_api_test(VoyagerIslandEnv(procedural=False), num_cycles=25)
          PY

  web:
    name: Viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
