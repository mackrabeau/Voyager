name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check voyager tests examples scripts leaderboard
      - name: Type check
        run: mypy voyager
      - name: Test
        run: pytest -q

  wheel:
    name: Clean wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/voyager-wheel-smoke
          /tmp/voyager-wheel-smoke/bin/python -m pip install dist/*.whl httpx
          cd /tmp
          /tmp/voyager-wheel-smoke/bin/python - <<'PY'
          from fastapi.testclient import TestClient

          import voyager
          from voyager.envs.island_v1 import parallel_env
          from voyager.server.app import create_app

          assert voyager.__version__ == "0.1.0"
          env = parallel_env()
          observations, infos = env.reset(seed=0)
          while env.agents:
              actions = {
                  agent: env.action_space(agent).sample(mask=infos[agent]["action_mask"])
                  for agent in env.agents
              }
              observations, rewards, terminations, truncations, infos = env.step(actions)
          env.close()
          client = TestClient(create_app())
          assert client.get("/").status_code == 200
          assert client.get("/healthz").json() == {"status": "ok", "replays": 5}
          PY
          /tmp/voyager-wheel-smoke/bin/voyager-random --seed 0

  docker:
    name: Docker demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo image
        run: docker build --tag voyager-island:ci .
      - name: Open demo and verify Stage 7 catalog
        run: |
          docker run --detach --rm --name voyager-island-ci --publish 8000:8000 voyager-island:ci
          trap 'docker stop voyager-island-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path

          assert json.loads(Path("/tmp/health.json").read_text()) == {
              "status": "ok",
              "replays": 5,
          }
          PY
          curl --fail --silent http://127.0.0.1:8000/ | grep --quiet '<div id="root"></div>'

  web:
    name: Viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
