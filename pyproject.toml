[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager-island"
version = "0.1.0"
description = "A deterministic two-agent reinforcement-learning benchmark for a finite stranded-island economy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Fawz Mehfil" },
]
keywords = [
  "reinforcement-learning",
  "multi-agent",
  "pettingzoo",
  "gymnasium",
  "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "gymnasium",
  "pettingzoo",
  "pydantic",
  "fastapi",
  "uvicorn",
]

[project.urls]
Homepage = "https://fawzmehfil.github.io/Voyager/"
Repository = "https://github.com/fawzmehfil/Voyager"
Issues = "https://github.com/fawzmehfil/Voyager/issues"
Benchmark = "https://github.com/fawzmehfil/Voyager/blob/main/BENCHMARK.md"

[project.scripts]
voyager-replay = "voyager.replay.cli:main"
voyager-web = "voyager.server.__main__:main"
voyager-random = "voyager.envs.random_rollout:main"

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
  "mypy",
]
train = [
  "tensorflow>=2.16; python_version < '3.14'",
]

[tool.setuptools.packages.find]
include = ["voyager*"]

[tool.setuptools.package-data]
voyager = [
  "py.typed",
  "server/static/*",
  "server/static/assets/*",
  "server/static/replays/*",
]
"voyager.data" = [
  "replays/stage7_curated_v1/*.json",
  "replays/stage7_curated_v1/*/*.json",
  "replays/stage7_curated_v1/*/*.json.gz",
  "replays/stage7_curated_v1/*/*/*.json.gz",
]
"voyager.data.manifests" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
packages = ["voyager"]
ignore_missing_imports = true
